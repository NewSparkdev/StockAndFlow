<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: linear-gradient(135deg, #2D1B69 0%, #4A2BA0 50%, #3B1F87 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px;
  }

  .left {
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .icon-box {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-box svg {
    width: 50px;
    height: 50px;
  }

  .brand {
    font-size: 38px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.5px;
  }

  .tagline {
    font-size: 20px;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
    max-width: 420px;
    font-weight: 400;
  }

  .pills {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pill {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
  }

  .right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
    flex-shrink: 0;
  }

  .stat-card {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 220px;
  }

  .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: white;
  }

  .stat-value.green { color: #5DF0A0; }
  .stat-value.red   { color: #FF6B6B; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo-row">
      <div class="icon-box">
        <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="28" width="8" height="18" rx="2" fill="rgba(255,255,255,0.5)"/>
          <rect x="16" y="20" width="8" height="26" rx="2" fill="rgba(255,255,255,0.7)"/>
          <rect x="28" y="12" width="8" height="34" rx="2" fill="rgba(255,255,255,0.85)"/>
          <rect x="40" y="4" width="8" height="42" rx="2" fill="white"/>
        </svg>
      </div>
      <div class="brand">Stock &amp; Flow</div>
    </div>
    <div class="tagline">Inventory, sales &amp; expenses<br>for your small business — offline, simple, fast.</div>
    <div class="pills">
      <div class="pill">Inventory</div>
      <div class="pill">Sales</div>
      <div class="pill">Expenses</div>
      <div class="pill">Reports</div>
      <div class="pill">Invoices</div>
    </div>
  </div>

  <div class="right">
    <div class="stat-card">
      <div class="stat-label">Total Revenue</div>
      <div class="stat-value green">$12,480</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Net Profit</div>
      <div class="stat-value green">$4,210</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value red">$2,140</div>
    </div>
  </div>
</body>
</html>
