name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/stockandflow-android.jks

      - name: Build signed AAB
        run: |
          dotnet publish StockAndFlow.Mobile/StockAndFlow.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$RUNNER_TEMP/stockandflow-android.jks \
            -p:AndroidSigningKeyAlias=stockandflow \
            -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -p:ApplicationId=dev.newspark.stockandflow \
            -p:ApplicationVersion=$(( ${{ github.run_number }} + 10 ))

      - name: Locate AAB
        id: find_aab
        run: |
          AAB=$(find . -name "*.aab" -not -path "*/obj/*" | head -1)
          echo "path=$AAB" >> $GITHUB_OUTPUT
          echo "Found AAB: $AAB"

      - name: Sign AAB
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore $RUNNER_TEMP/stockandflow-android.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            ${{ steps.find_aab.outputs.path }} \
            stockandflow

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockandflow-android-${{ github.sha }}
          path: ${{ steps.find_aab.outputs.path }}
          if-no-files-found: error

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.newspark.stockandflow
          releaseFiles: ${{ steps.find_aab.outputs.path }}
          track: internal
          status: completed
