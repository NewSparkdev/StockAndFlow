name: iOS Simulator Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios maui-android

      - name: Install idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          python3 -m pip install --user --break-system-packages fb-idb pillow
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications/ | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting: $LATEST"
            sudo xcode-select -switch "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch
          DEV=$(xcode-select -p)
          SDKS="$DEV/Platforms/MacOSX.platform/Developer/SDKs"
          echo "macOS SDKs before fix:"
          ls -la "$SDKS" 2>/dev/null || echo none
          OLDER_XCODES=$(ls -d /Applications/Xcode_26.5*.app /Applications/Xcode_26.4*.app /Applications/Xcode_26.3*.app 2>/dev/null | sort -rV)
          GOOD_SDK=""
          for APP in $OLDER_XCODES; do
            SDK_DIR="$APP/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            REAL_SDK=$(find "$SDK_DIR" -maxdepth 1 -name "MacOSX*.sdk" -not -type l -type d 2>/dev/null | sort -V | tail -1)
            if [ -n "$REAL_SDK" ]; then
              GOOD_SDK="$REAL_SDK"
              break
            fi
          done
          if [ -n "$GOOD_SDK" ]; then
            echo "Replacing broken SDK with: $GOOD_SDK"
            sudo mkdir -p "$SDKS"
            sudo rm -rf "$SDKS/MacOSX.sdk"
            sudo ln -sf "$GOOD_SDK" "$SDKS/MacOSX.sdk"
            echo "Linked MacOSX.sdk -> $GOOD_SDK"
          else
            echo "WARNING: No older Xcode macOS SDK found"
          fi
          echo "macOS SDKs after fix:"
          ls -la "$SDKS"

      - name: Build for simulator
        run: |
          dotnet build StockAndFlow.Mobile/StockAndFlow.Mobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -r iossimulator-arm64 \
            -p:ApplicationId=dev.newspark.stockandflow

      - name: Boot iPhone 16 Pro Max simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro Max" | head -1 | grep -oE '[A-F0-9-]{36}' || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl create "iPhone 16 Pro Max" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max")
          fi
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b

      - name: Install app on simulator
        run: |
          APP_PATH=$(find StockAndFlow.Mobile/bin -name "*.app" -path "*/iossimulator-arm64/*" | head -1)
          echo "Found app at: $APP_PATH"
          xcrun simctl install $SIMULATOR_UDID "$APP_PATH"

      - name: Skip the first-launch onboarding carousel
        run: |
          # App.xaml.cs gates onboarding on Preferences "onboarding_done" (NSUserDefaults,
          # standard suite = bundle id). Pre-seed it so we land straight on the dashboard —
          # a fresh install otherwise shows a 4-page welcome carousel with no tab bar at all.
          xcrun simctl spawn $SIMULATOR_UDID defaults write dev.newspark.stockandflow onboarding_done -bool YES

      - name: Start idb companion
        run: |
          idb_companion --udid $SIMULATOR_UDID > idb_companion.log 2>&1 &
          echo $! > idb_companion.pid
          sleep 5
          cat idb_companion.log || true
          idb list-targets

      - name: Take screenshots of all screens
        run: |
          mkdir -p screenshots
          BUNDLE_ID=dev.newspark.stockandflow

          # A raw byte comparison of two screenshots is unreliable here: the status bar clock
          # ticks over roughly once a minute, which can make two screenshots of the exact same
          # (unchanged) page look "different" purely from the clock text — producing a false
          # "the tap worked" verdict that isn't actually true. This crops out the status bar
          # (top 220px of the 1320x2868 capture) before comparing pixel data.
          cat > /tmp/crop_cmp.py <<'PYEOF'
          import sys
          from PIL import Image
          a = Image.open(sys.argv[1]).convert('RGB')
          b = Image.open(sys.argv[2]).convert('RGB')
          crop = lambda im: im.crop((0, 220, im.width, im.height))
          sys.exit(0 if list(crop(a).getdata()) == list(crop(b).getdata()) else 1)
          PYEOF

          # idb occasionally drops a tap silently (no error, UI just doesn't move) — seen on
          # different taps across runs, and a blind double-tap didn't fully fix it. Instead,
          # actually check whether the screen changed and retry the tap(s) if it didn't: every
          # target here is either a tab (BottomNavBar.cs no-ops if already active) or a button
          # about to navigate away, so a harmless repeat tap can't land on the wrong thing.
          snap() {
            local outfile="$1"; shift
            local coords=("$@")
            for attempt in 1 2 3; do
              local i=0
              while [ $i -lt ${#coords[@]} ]; do
                idb ui tap "${coords[$i]}" "${coords[$((i+1))]}" --udid $SIMULATOR_UDID
                sleep 1
                i=$((i+2))
              done
              sleep 1
              xcrun simctl io $SIMULATOR_UDID screenshot "$outfile"
              if [ ! -f /tmp/prev_shot.png ] || ! python3 /tmp/crop_cmp.py "$outfile" /tmp/prev_shot.png; then
                break
              fi
              echo "WARNING: $outfile unchanged after attempt $attempt, retrying tap(s): ${coords[*]}"
            done
            cp "$outfile" /tmp/prev_shot.png
          }

          # Detects the launch splash page (App.xaml.cs's BuildLoadingPage): solid purple with no
          # white content area. Sampling one pixel where the Dashboard's white scroll content
          # always is (px 660,1200 — well inside the header-to-navbar white area on every real
          # page) is enough to tell "still loading" from "actually rendered".
          cat > /tmp/is_still_splash.py <<'PYEOF'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('RGB')
          r, g, b = im.getpixel((660, 1200))
          sys.exit(0 if not (r > 200 and g > 200 and b > 200) else 1)
          PYEOF
          is_still_splash() { python3 /tmp/is_still_splash.py "$1"; }

          # Launch app — SIMCTL_CHILD_ prefix passes SEED_DEMO_DATA into the app's environment
          # (see DemoDataSeeder.cs) so screenshots show a populated demo business, not empty states.
          SIMCTL_CHILD_SEED_DEMO_DATA=1 xcrun simctl launch $SIMULATOR_UDID $BUNDLE_ID
          sleep 9   # seeding 24 rows (10 items, 9 sales, 7 expenses) takes longer than the old sleep 4

          # 1. Dashboard — a fixed sleep isn't reliable (seeding time varies enough that this has
          # caught the splash screen instead of the dashboard in more than one run); actually
          # check and wait longer if it's not ready yet.
          for attempt in 1 2 3 4 5; do
            xcrun simctl io $SIMULATOR_UDID screenshot screenshots/01_dashboard.png
            if ! is_still_splash screenshots/01_dashboard.png; then
              break
            fi
            echo "WARNING: still on the launch splash screen after attempt $attempt, waiting more..."
            sleep 4
          done
          cp screenshots/01_dashboard.png /tmp/prev_shot.png

          # The very first idb tap of the sequence has failed all 3 retries in multiple runs,
          # while every later tap (seconds apart) succeeds reliably. Root cause: idb_companion's
          # connection sits completely idle from the "idb list-targets" sanity check (Start idb
          # companion step) through the entire launch+seed+dashboard-ready wait — around a minute
          # with zero idb traffic, confirmed from run timestamps — long enough that its first real
          # command afterward can fail/hang while it re-negotiates. Ping it right before that first
          # real tap instead of leaving it idle the whole time.
          idb list-targets --udid $SIMULATOR_UDID >/dev/null 2>&1 || true
          sleep 1

          # BottomNavBar.cs: HeightRequest=84, Grid Padding(8,8,8,10), ColumnSpacing=6, 5 equal
          # star columns. iPhone 16 Pro Max is 440x956 points (1320x2868px / 3x — verified from
          # a captured screenshot, NOT the 393x852 an earlier version of this script assumed).
          # Column width = (440 - 16 padding - 4*6 spacing) / 5 = 80; center of column i:
          # 8 + i*86 + 40. The bar sits ABOVE the 34pt bottom safe-area inset, not flush to the
          # screen edge (confirmed by sampling actual screenshot pixels: purple background runs
          # from px 2514-2765, i.e. points 838-921.7 at 3x) — center y = 880, not 956-84/2=914.
          # 2. Inventory tab (column 1)
          snap screenshots/02_inventory.png 134 880

          # 3. Sales tab (column 2)
          snap screenshots/03_sales.png 220 880

          # 4. Expenses tab (column 3)
          snap screenshots/04_expenses.png 306 880

          # 5. Reports tab (column 4) — SEED_DEMO_DATA also grants the Pro entitlement (see
          # DemoDataSeeder.cs), so this is the real charts page now, not the paywall.
          snap screenshots/05_reports.png 392 880

          # Finds a native accessibility element by its exact label and prints "x y" (its center,
          # in points) on stdout, or nothing if not found. Used only for the "Close" toolbar item
          # below — a real UIBarButtonItem, unlike BottomNavBar's custom gesture-recognizer tiles,
          # so its position isn't worth hand-measuring: idb can find it directly by label.
          cat > /tmp/find_label.py <<'PYEOF'
          import json, sys, re
          label = sys.argv[1]
          data = json.loads(sys.stdin.read())
          items = data if isinstance(data, list) else [data]
          def frame_of(el):
              f = el.get('frame')
              if isinstance(f, dict) and all(k in f for k in ('x','y','width','height')):
                  return f['x'], f['y'], f['width'], f['height']
              s = el.get('AXFrame')
              if isinstance(s, str):
                  m = re.match(r'\{\{([\d.-]+), ([\d.-]+)\}, \{([\d.-]+), ([\d.-]+)\}\}', s)
                  if m:
                      return tuple(float(g) for g in m.groups())
              return None
          for el in items:
              lbl = el.get('AXLabel') or el.get('label') or el.get('title') or el.get('AXTitle') or ''
              if lbl.strip().lower() == label.lower():
                  fr = frame_of(el)
                  if fr:
                      x, y, w, h = fr
                      print(f"{x + w/2:.0f} {y + h/2:.0f}")
                      sys.exit(0)
          sys.exit(1)
          PYEOF

          # describe-all occasionally returns empty/non-JSON output (a transient idb hiccup,
          # unrelated to whether "Close" is actually on screen) — fetch with its own retry so
          # that doesn't get misread as "element not found".
          describe_all() {
            for fetch in 1 2 3; do
              RAW=$(idb ui describe-all --udid $SIMULATOR_UDID --json 2>/dev/null || true)
              case "$RAW" in
                \[*) printf '%s' "$RAW"; return 0 ;;
              esac
              sleep 1
            done
            printf '%s' "$RAW"   # give up — return whatever we last got, even if not JSON
          }

          # Finds "Close" and taps it, retrying up to 3x if the element is still present
          # afterwards (i.e. the tap didn't register) — same rationale as snap() above.
          tap_close() {
            for attempt in 1 2 3; do
              RAW=$(describe_all)
              COORDS=$(printf '%s' "$RAW" | python3 /tmp/find_label.py "Close" 2>/dev/null || true)
              if [ -z "$COORDS" ]; then
                if [ $attempt -eq 1 ]; then
                  echo "WARNING: could not find accessibility element labeled 'Close' — dumping raw output for diagnosis:"
                  printf '%s' "$RAW" | head -c 4000
                  return 1
                fi
                return 0   # gone after a previous successful tap — done
              fi
              echo "Tapping 'Close' at $COORDS (attempt $attempt)"
              idb ui tap $COORDS --udid $SIMULATOR_UDID
              sleep 1
            done
            echo "WARNING: 'Close' still present after 3 tap attempts — giving up"
            return 1
          }

          # 6. Settings (from Dashboard — MainPage.xaml.cs's toolbar action). Position measured
          # directly from the captured 01_dashboard.png (native toolbar button, right-aligned).
          # Two independently-verified taps, not one snap() call with both coords: snap() only
          # checks the FINAL result, so if the first tap (switch tab) silently succeeded but the
          # second (open Settings) silently failed, it would go undetected — as happened to the
          # Record Sale step below in an earlier run (Sales tab worked, Record tap didn't, and
          # the step still "passed" because the overall screen had changed from the Reports tab).
          snap /tmp/settle.png 48 880
          snap screenshots/06_settings.png 371 85

          # Dismiss the Settings modal (SettingsPage.xaml has a "Close" ToolbarItem) so the tab bar
          # underneath is reachable again. If this fails, the rest of the sequence is skipped but
          # the 6 screenshots already taken still get uploaded (see "Upload screenshots" step).
          if tap_close; then
            # Back on Dashboard now — establish a fresh baseline so snap() can detect whether
            # the next taps (Sales tab, then Record) actually change the screen.
            xcrun simctl io $SIMULATOR_UDID screenshot /tmp/prev_shot.png

            # 7. Record Sale (from Sales — SalesViewModel's "Record" action opens the cart page).
            # Position measured directly from the captured 03_sales.png. This is the LAST
            # screenshot, so the modal is never dismissed — nothing needs it after this.
            snap /tmp/settle.png 220 880
            snap screenshots/07_record_sale.png 272 84
          fi

          ls -lh screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: error
