name: iOS Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios maui-android

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications/ | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting: $LATEST"
            sudo xcode-select -switch "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch
          DEV=$(xcode-select -p)
          SDKS="$DEV/Platforms/MacOSX.platform/Developer/SDKs"
          echo "macOS SDKs before fix:"
          ls -la "$SDKS" 2>/dev/null || echo none
          OLDER_XCODES=$(ls -d /Applications/Xcode_26.5*.app /Applications/Xcode_26.4*.app /Applications/Xcode_26.3*.app 2>/dev/null | sort -rV)
          GOOD_SDK=""
          for APP in $OLDER_XCODES; do
            SDK_DIR="$APP/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
            REAL_SDK=$(find "$SDK_DIR" -maxdepth 1 -name "MacOSX*.sdk" -not -type l -type d 2>/dev/null | sort -V | tail -1)
            if [ -n "$REAL_SDK" ]; then
              GOOD_SDK="$REAL_SDK"
              break
            fi
          done
          if [ -n "$GOOD_SDK" ]; then
            echo "Replacing broken SDK with: $GOOD_SDK"
            sudo mkdir -p "$SDKS"
            sudo rm -rf "$SDKS/MacOSX.sdk"
            sudo ln -sf "$GOOD_SDK" "$SDKS/MacOSX.sdk"
            echo "Linked MacOSX.sdk -> $GOOD_SDK"
          else
            echo "WARNING: No older Xcode macOS SDK found"
          fi
          echo "macOS SDKs after fix:"
          ls -la "$SDKS"
          echo "actool test:"
          xcodebuild -sdk "$SDKS/MacOSX.sdk" -find actool 2>&1 || echo "WARNING: actool not found"

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Import provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/dist.mobileprovision
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and sign IPA
        run: |
          dotnet publish StockAndFlow.Mobile/StockAndFlow.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            -p:CodesignProvision="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" \
            -p:ApplicationId=dev.newspark.stockandflow \
            -p:ApplicationDisplayVersion=1.0.0 \
            -p:ApplicationVersion=6

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockandflow-ios-${{ github.sha }}
          path: '**/*.ipa'
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find . -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          mkdir -p /tmp/asc
          python3 - <<'PYEOF'
          import json, base64, os
          key = base64.b64decode(os.environ['PRIVATE_KEY_BASE64']).decode('utf-8')
          data = {
              "key_id": os.environ['KEY_ID'],
              "issuer_id": os.environ['ISSUER_ID'],
              "key": key,
              "is_key_content_base64": False,
              "duration": 1200,
              "in_house": False
          }
          with open('/tmp/asc/api_key.json', 'w') as f:
              json.dump(data, f)
          PYEOF
          fastlane pilot upload \
            --api_key_path /tmp/asc/api_key.json \
            --ipa "$IPA_PATH" \
            --skip_submission true \
            --skip_waiting_for_build_processing true

